name: Publish signed update

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag, e.g. v0.3.1
        required: true
        type: string
      bootstrap:
        description: First release; no appcast.xml exists yet
        default: false
        type: boolean
      resume:
        description: Finish an interrupted release with the identical archive
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Require update signing key
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo 'SPARKLE_PRIVATE_KEY is required; unsigned updates will not be published.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import subprocess
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'macosx', '--show-sdk-version'], text=True).strip().split('.')))
          assert sdk >= (26, 4), 'The app needs a macOS 26.4+ SDK (Xcode 26.4+).'
          PY
      - name: Validate release tooling
        run: python3 -m unittest discover -s Packaging -p 'test_*.py'
      - name: Test
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
          SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
        run: swift test --disable-sandbox --disable-keychain --cache-path .build/cache --scratch-path .build
      - name: Build app bundle
        run: zsh Packaging/build.sh dist/release
      - name: Publish signed archive and feed
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap }}
          RELEASE_RESUME: ${{ inputs.resume }}
        run: |
          args=(publish --app dist/release/Toplanti.app --tag "$RELEASE_TAG")
          if [ "$RELEASE_BOOTSTRAP" = true ]; then args+=(--bootstrap); fi
          if [ "$RELEASE_RESUME" = true ]; then args+=(--resume); fi
          if [ -f docs/release-notes.md ]; then args+=(--notes-file docs/release-notes.md); fi
          python3 Packaging/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-${{ inputs.tag || github.ref_name }}
          path: dist/releases/
          if-no-files-found: ignore
          retention-days: 14
